# The status page: probe, keep the history, publish to GitHub Pages. Runs in the PUBLIC
# `earndlife/STATUS` repository, which is this folder as published (status/publish.sh) plus the
# incidents written there, so its minutes are free and the page is served by GitHub, away from
# Earnd's own box. GitHub runs the schedule late when it is busy (status/README.md, "How often it
# runs"); a push to main, a publish or an incident, runs it at once.
#
# History lives on the `data` branch, one small JSON file rewritten each run, so `main` holds only
# the page and its scripts. Pages is deployed from the artifact, never from a branch, and a deploy
# that cannot find the artifact just uploaded is tried once more a minute later (below).
name: Status

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: status
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-again.outputs.page_url }}
    steps:
      # v5, not later: v6 keeps the token in a separate file, and the history step below pushes
      # from a git worktree, which that file may not reach.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore the history (the data branch)
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show origin/data:history.json > data/history.json || echo '{"version":1,"days":{}}' > data/history.json
          else
            echo '{"version":1,"days":{}}' > data/history.json
          fi

      - name: Probe every component
        run: node scripts/probe.mjs --components components.json --history data/history.json --out site

      - name: Keep the history (the data branch)
        run: |
          git config user.name "earnd-status"
          git config user.email "status@earnd.life"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git worktree add -q wt origin/data
            git -C wt checkout -q -B data origin/data
          else
            git worktree add -q --detach wt
            git -C wt checkout -q --orphan data
            git -C wt rm -rfq . >/dev/null 2>&1 || true
          fi
          cp data/history.json wt/history.json
          git -C wt add history.json
          git -C wt commit -qm "history $(date -u +%FT%TZ)" || true
          git -C wt push -q origin data

      - name: Build the page
        run: node scripts/build.mjs --root . --history data/history.json --out site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # build.mjs writes site/.nojekyll; since v4 a dotfile is left out unless asked for.
          include-hidden-files: true

      # GitHub sometimes cannot find the artifact the step above has just stored ("No artifacts
      # named github-pages were found ... Is githubstatus.com reporting issues"): three of the five
      # runs from 23 to 25 November 2026 stopped there, after probing and keeping the history, so
      # the page showed a check 26 hours old. The first try may fail; a minute later the same
      # artifact is asked for again, and only that second try can fail the run.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait a minute before deploying again
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: deploy-again
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
